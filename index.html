<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yash Rai Sharma | Project Abyss</title>
    
    <!-- React & Babel Engines -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cinzel:wght@700&display=swap');
        :root { --terminal-green: #00ff41; --dark-bg: #050505; }
        body, html { margin: 0; padding: 0; background: var(--dark-bg); color: var(--terminal-green); font-family: 'Space Mono', monospace; overflow-x: hidden; }
        
        /* CRT Effect Overlay */
        body::before {
            content: " "; display: block; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2001; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        .countdown-section { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .timer-digits { font-size: clamp(2rem, 12vw, 8rem); font-weight: 700; text-shadow: 0 0 20px var(--terminal-green); }
        .timer-label { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 5px; opacity: 0.6; }

        .crevice { max-width: 800px; margin: 50px auto; padding: 40px; border: 1px solid var(--terminal-green); background: rgba(0, 255, 65, 0.03); }
        .label { border-bottom: 1px solid var(--terminal-green); margin-bottom: 20px; font-weight: 700; letter-spacing: 2px; display: inline-block; }
        
        .gate { position: fixed; inset: 0; background: #000; z-index: 3000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Portfolio() {
            const [entered, setEntered] = useState(false);
            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0 });

            // Target: May 20, 2026 (UPSC Goal)
            const targetDate = new Date("May 20, 2026 00:00:00").getTime();

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = targetDate - now;
                    setTimeLeft({
                        d: Math.floor(distance / (1000 * 60 * 60 * 24)),
                        h: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        m: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                        s: Math.floor((distance % (1000 * 60)) / 1000)
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleEntry = () => {
                setEntered(true);
                const audio = new Audio('https://www.soundjay.com/nature/ocean-wave-1.mp3');
                audio.loop = true;
                audio.play().catch(e => console.log("Audio block: ", e));
            };

            return (
                <div>
                    {!entered && (
                        <div className="gate" onClick={handleEntry}>
                            <h2 style={{letterSpacing: '10px', animation: 'pulse 2s infinite', color: '#00ff41'}}>INITIALIZE DESCEND</h2>
                        </div>
                    )}

                    <div style={{ opacity: entered ? 1 : 0, transition: 'opacity 2s ease', padding: '20px' }}>
                        <section className="countdown-section">
                            <div className="timer-digits">{timeLeft.d}:{timeLeft.h}:{timeLeft.m}:{timeLeft.s}</div>
                            <div className="timer-label">DAYS : HOURS : MIN : SEC</div>
                            <h1 style={{marginTop: '30px', color: '#fff'}}>YASH RAI SHARMA</h1>
                            <p style={{opacity: 0.6}}>UPSC 2026 ASPIRANT | TECHNOCRAT</p>
                        </section>

                        <section className="crevice">
                            <div className="label">SYSTEM SUMMARY</div>
                            <p>Technocrat with bases in Software development, Quantum Computing, AR/VR and Cyber Security. Currently focused on finishing the UPSC syllabus by May 2026.</p>
                        </section>

                        <section className="crevice">
                            <div className="label">ACTIVE DEPLOYMENT: VECHTECH</div>
                            <p><b>Director | VechTech Consulting | Apr 2023 - Present</b></p>
                            <p>Facilitated development of speech recognition software and business ERP solutions. Managed a freelance team to complete over 6 web development projects.</p>
                        </section>

                        <section className="crevice">
                            <div className="label">ACADEMIC LOG</div>
                            <p><b>SRM Institute of Science and Technology</b></p>
                            <p>B.Tech, CSE (Software Engineering) | May 2024 | CGPA: 8.5</p>
                        </section>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
